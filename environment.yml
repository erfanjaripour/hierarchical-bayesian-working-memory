name: hierarchical-bayesian-working-memory

channels:
  - conda-forge

dependencies:
  - python=3.12
  - numpy=2.5.0
  - pandas=3.0.3
  - scipy=1.18.0
  - matplotlib=3.11.0
  - seaborn=0.13.2
  - pymc=5.26.1
  - arviz=0.23.4
  - jupyterlab
  - ipykernel
  - graphviz
  - python-graphviz
  - tqdm

  # Packages installed through pip
  - pip
  - pip:
      - jax==0.10.2
      - jaxlib==0.10.2
      - numpyro==0.21.0
      - opt-einsum==3.4.0